[workspace]
resolver = "3"
members = ["crates/tlacuache-core", "crates/tlacuache"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ricardo Monroy <rmonroy.rodriguez@gmail.com>"]
license = "GPL-3.0-or-later"

# gtk4 0.11, libadwaita 0.9, vte4 0.10 y sourceview5 0.11 comparten glib/gio 0.22.
# Features alineadas con las bibliotecas del sistema en Arch:
# gtk 4.22, libadwaita 1.9, vte 0.84, gtksourceview 5.20.
# vte4 0.10 requiere gtk4 con feature >= v4_10 (gtk::Accessible); la aporta `v4_22`.
[workspace.dependencies]
tlacuache-core = { path = "crates/tlacuache-core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
vte = { package = "vte4", version = "0.10.0", features = ["v0_84"] }
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
# Vista previa de PDF (8.1). Usa glib/gio/cairo 0.22 como gtk4 0.11.
poppler = { package = "poppler-rs", version = "0.26.0" }
# Directo solo para activar features de la glib del sistema (2.88):
# `user_state_dir` necesita v2_72. Es la misma glib que re-exporta gtk.
glib = { version = "0.22.10", features = ["v2_72"] }
# `File::move_async` (mover con progreso y cancelación) necesita v2_72.
gio = { version = "0.22.10", features = ["v2_72"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
# Reescribe [[favorites]] conservando comentarios y formato de config.toml.
toml_edit = "0.25.15"
tracing = "0.1.44"
# Renombrado masivo (8.7).
regex = "1.13.1"
# Markdown renderizado en la vista previa (8.3); sin HTML.
pulldown-cmark = { version = "0.13.4", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-channel = "2.5.0"
# `tcgetpgrp`: saber si el shell de la terminal está en primer plano.
libc = "0.2.190"
glib-build-tools = "0.22.8"
tempfile = "3.27.0"
