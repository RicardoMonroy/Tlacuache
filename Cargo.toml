[workspace]
resolver = "3"
members = ["crates/tlacuache-core", "crates/tlacuache"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ricardo Monroy <rmonroy.rodriguez@gmail.com>"]

# gtk4 0.11, libadwaita 0.9, vte4 0.10 y sourceview5 0.11 comparten glib/gio 0.22.
# Features alineadas con las bibliotecas del sistema en Arch:
# gtk 4.22, libadwaita 1.9, vte 0.84, gtksourceview 5.20.
# vte4 0.10 requiere gtk4 con feature >= v4_10 (gtk::Accessible); la aporta `v4_22`.
[workspace.dependencies]
tlacuache-core = { path = "crates/tlacuache-core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
vte = { package = "vte4", version = "0.10.0", features = ["v0_84"] }
sourceview5 = { version = "0.11.2", features = ["v5_18"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-channel = "2.5.0"
glib-build-tools = "0.22.8"
tempfile = "3.27.0"
