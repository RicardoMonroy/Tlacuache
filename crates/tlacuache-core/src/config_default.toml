# Configuración de Tlacuache Browser.
# Todas las claves son opcionales: lo que borres vuelve a su valor por defecto.

[general]
show_hidden = false
dual_pane = true
confirm_trash = false
default_view = "columns"   # columns (Miller) | details (lista)

[preview]
position = "bottom"        # bottom | right
max_text_bytes = 1048576

[terminal]
shell = ""                 # vacío = $SHELL
font = ""                  # vacío = font_mono del tema
font_size = 11
sync_panel_to_terminal = true
sync_terminal_to_panel = true
shell_integration = true   # OSC 7 automático (bash y zsh) para que el panel siga los cd

[theme]
name = "nord"              # nord | consola | claro | cyberpunk | talavera
follow_system = false      # true: usa `light`/`dark` según el sistema
light = "claro"
dark = "nord"

# Favoritos agrupados (uno o más bloques):
# [[favorites]]
# group = "Proyectos"
# paths = ["~/dev", "~/Documentos/clases"]

# Atajos remapeables (sintaxis de GTK): acción = "acelerador"
[keys]
# toggle_terminal = "F4"
# leave_terminal = "<Control><Shift>Tab"
