# Tlacuache Browser — tema predeterminado
[meta]
id = "nord"
name = "Nord"
description = "Ártico, sereno y legible. El tema predeterminado."
variant = "dark"            # dark | light → adw::StyleManager color scheme
credits = "Paleta Nord (MIT) — https://www.nordtheme.com"

[style]
font_ui = ""                # vacío = fuente del sistema
font_mono = "JetBrains Mono"
mono_ui = false
radius = 8
border_width = 1
row_height = 26
flat = false
glow = false
uppercase_headers = false
bracket_titles = false
icon_style = "color"        # color | symbolic | glyph
selection_style = "fill"    # fill | invert
age_style = "chip"          # chip | text

[colors]
window_bg = "#2E3440"
sidebar_bg = "#3B4252"
sidebar_fg = "#E5E9F0"
header_bg = "#3B4252"
header_fg = "#ECEFF4"
pane_bg = "#2E3440"
pane_alt_row = "#313845"
fg = "#ECEFF4"
fg_muted = "#A7B0C0"
border = "#434C5E"
border_strong = "#4C566A"
hover_bg = "#3B4252"
accent = "#88C0D0"
accent_fg = "#2E3440"
focus_ring = "#88C0D0"
selection_bg = "#4C6A94"
selection_fg = "#ECEFF4"
selection_inactive_bg = "#434C5E"
pane_active_border = "#88C0D0"
success = "#A3BE8C"
warning = "#EBCB8B"
error = "#E0848D"
info = "#81A1C1"
link = "#88C0D0"

[age]                       # buckets definidos en docs/THEMES.md §3 (hour <24 h · day 1–6 d · week 7–29 d · month 1–11 meses · year ≥1 año)
chip_fg = "#2E3440"
hour = "#A3BE8C"
day = "#8FBCBB"
week = "#88C0D0"
month = "#81A1C1"
year = "#97A2B7"

[filetypes]
folder = "#81A1C1"
code = "#8FBCBB"
image = "#B48EAD"
video = "#BF616A"
audio = "#D08770"
archive = "#EBCB8B"
document = "#88C0D0"
pdf = "#BF616A"
spreadsheet = "#A3BE8C"
text = "#D8DEE9"
executable = "#A3BE8C"
other = "#A7B0C0"

[terminal]
background = "#2E3440"
foreground = "#D8DEE9"
cursor = "#D8DEE9"
cursor_text = "#2E3440"
selection_bg = "#434C5E"
selection_fg = "#ECEFF4"
palette = ["#3B4252", "#BF616A", "#A3BE8C", "#EBCB8B", "#81A1C1", "#B48EAD", "#88C0D0", "#E5E9F0",
           "#4C566A", "#BF616A", "#A3BE8C", "#EBCB8B", "#81A1C1", "#B48EAD", "#8FBCBB", "#ECEFF4"]
